name: Knowledge assistant visual acceptance
on:
  pull_request:
    paths:
      - "site/app/ask/**"
      - "site/public/assistant.css"
      - "site/app/layout.tsx"
      - "site/features/ask/**"
      - "site/features/navigation/nav/**"
      - "site/public/ask.css"
      - "site/server/qa-retrieval.ts"
      - "site/app/api/ask/route.ts"
      - "site/scripts/visual-ask-acceptance.mjs"
      - ".github/workflows/ask-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Build production worker for local isolated test
        run: npm run build
      - name: Install CJK browser fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify desktop mobile and dark assistant UI
        run: node scripts/visual-ask-acceptance.mjs
      - name: Upload assistant screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xingyu-ask-visual-acceptance
          path: site/visual-ask/*.png
          if-no-files-found: warn
          retention-days: 14
