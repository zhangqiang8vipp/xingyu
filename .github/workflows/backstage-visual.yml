name: AXIS whole-backstage visual acceptance

on:
  pull_request:
    paths:
      - "site/features/admin/**"
      - "site/app/admin/**"
      - "site/scripts/visual-backstage-acceptance.mjs"
      - ".github/workflows/backstage-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axis-backstage-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Nine backend pages, desktop, tablet, phone, dark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build real Worker without remote production bindings
        run: npm run build
      - name: Install CJK browser fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Test all AXIS backend pages and unsaved controls in Chromium
        run: node scripts/visual-backstage-acceptance.mjs
      - name: Save full-backstage desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axis-whole-backstage-visual
          path: site/visual-backstage/*.png
          if-no-files-found: warn
          retention-days: 14
