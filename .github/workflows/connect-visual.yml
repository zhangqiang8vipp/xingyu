name: Connect visual acceptance
on:
  pull_request:
    paths:
      - "site/app/connect/**"
      - "site/app/ai-connections/**"
      - "site/features/admin/**"
      - "site/public/connect-marketing.css"
      - "site/scripts/visual-connect-acceptance.mjs"
      - ".github/workflows/connect-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production Worker
        run: npm run build
      - name: Install CJK browser fallback fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Inspect built admin assets
        run: find dist -iname '*admin*' -type f | head -30
      - name: Capture and check real Connect pages
        run: node scripts/visual-connect-acceptance.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-visual-acceptance
          path: site/visual-connect/*.png
          if-no-files-found: warn
          retention-days: 14
