name: One-time Gemini scope production deploy

# Temporary, one-time deployment trigger. Remove this workflow and marker after the run.
on:
  push:
    branches:
      - main
    paths:
      - ".deploy-once-gemini-scope-20261020"

permissions:
  contents: read

concurrency:
  group: xingyu-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify one-time release request
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - name: Verify exact main-branch one-time trigger
        working-directory: .
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "::error::This temporary deployment may only run on a main push."
            exit 1
          fi
          node - "$GITHUB_EVENT_PATH" <<'NODE'
          const fs = require("node:fs");
          const event = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const sentinel = "ONE-TIME-PRODUCTION-DEPLOY-GEMINI-SCOPE-20261020";
          const commits = Array.isArray(event.commits) ? event.commits : [];
          const allowed = commits.some((commit) => String(commit.message || "").includes(sentinel));
          if (!allowed) {
            console.error("One-time deployment sentinel did not match.");
            process.exit(1);
          }
          NODE

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm one-time marker contents
        run: |
          grep -Fxq "ONE-TIME-PRODUCTION-DEPLOY-GEMINI-SCOPE-20261020" ../.deploy-once-gemini-scope-20261020
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Run the full CI suite
        run: npm run ci
      - name: Validate production bindings without contacting production
        run: node scripts/verify-production-deploy.mjs config

  deploy:
    name: Production approval and deployment
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: CLOUDFLARE
      url: https://zhangwansen.click
    defaults:
      run:
        working-directory: site
    steps:
      - name: Require production opt-in and Cloudflare credentials
        working-directory: .
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ "$PRODUCTION_DEPLOY_ENABLED" != "true" ]]; then
            echo "::error::CLOUDFLARE environment must set PRODUCTION_DEPLOY_ENABLED=true."
            exit 1
          fi
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE environment must contain both Cloudflare secrets."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Confirm production worker and resource bindings
        run: node scripts/verify-production-deploy.mjs config

      # Read-only preflight. No production D1 migration or seed writes.
      - name: Verify remote production D1 schema and instance identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_WRITE_LOGS: "false"
        run: |
          npx wrangler d1 execute DB \
            --config wrangler.production.jsonc \
            --remote \
            --command "SELECT key, value FROM app_meta WHERE key IN ('schema_version', 'app_environment', 'instance_id')" \
            --json > "$RUNNER_TEMP/xingyu-production-d1-meta.json"
          node scripts/verify-production-deploy.mjs d1 "$RUNNER_TEMP/xingyu-production-d1-meta.json"

      - name: Build and deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_WRITE_LOGS: "false"
        run: npm run deploy:production

      - name: Smoke test homepage, OAuth discovery and protected MCP
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "https://zhangwansen.click/" -o /dev/null

          confirmed=0
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "https://zhangwansen.click/.well-known/oauth-authorization-server" \
              -o "$RUNNER_TEMP/xingyu-oauth-metadata.json" \
              && node scripts/verify-production-deploy.mjs oauth "$RUNNER_TEMP/xingyu-oauth-metadata.json"; then
              confirmed=1
              break
            fi
            sleep 5
          done
          if [[ "$confirmed" != "1" ]]; then
            echo "::error::Production OAuth discovery failed after deploy."
            exit 1
          fi

          status="$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" "https://zhangwansen.click/mcp")"
          if [[ "$status" != "401" ]]; then
            echo "::error::Unauthenticated production MCP must return 401, got $status."
            exit 1
          fi
