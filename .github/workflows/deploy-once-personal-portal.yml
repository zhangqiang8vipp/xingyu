name: One-time production deploy - personal portal

# Temporary, marker-only production release. Remove this workflow and marker immediately after the run.
on:
  push:
    branches: [main]
    paths:
      - .deploy-once-personal-portal-20261020

permissions:
  contents: read

concurrency:
  group: xingyu-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: contains(github.event.head_commit.message, 'ONE-TIME-PRODUCTION-DEPLOY-PERSONAL-PORTAL-20261020')
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify one-time marker contents
        working-directory: .
        run: test "$(cat .deploy-once-personal-portal-20261020)" = "ONE-TIME-PRODUCTION-DEPLOY-PERSONAL-PORTAL-20261020"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Run the full CI suite
        run: npm run ci
      - name: Validate production bindings without contacting production
        run: node scripts/verify-production-deploy.mjs config

  deploy:
    if: contains(github.event.head_commit.message, 'ONE-TIME-PRODUCTION-DEPLOY-PERSONAL-PORTAL-20261020')
    name: Production approval and deployment
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: CLOUDFLARE
      url: https://zhangwansen.click
    defaults:
      run:
        working-directory: site
    steps:
      - name: Require explicit production opt-in and Cloudflare credentials
        working-directory: .
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ "$PRODUCTION_DEPLOY_ENABLED" != "true" ]]; then
            echo "::error::Configure PRODUCTION_DEPLOY_ENABLED=true in the CLOUDFLARE GitHub Environment."
            exit 1
          fi
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as CLOUDFLARE environment secrets."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Confirm production worker and resource bindings
        run: node scripts/verify-production-deploy.mjs config
      - name: Verify remote production D1 schema and instance identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_WRITE_LOGS: "false"
        run: |
          npx wrangler d1 execute DB \
            --config wrangler.production.jsonc \
            --remote \
            --command "SELECT key, value FROM app_meta WHERE key IN ('schema_version', 'app_environment', 'instance_id')" \
            --json > "$RUNNER_TEMP/xingyu-production-d1-meta.json"
          node scripts/verify-production-deploy.mjs d1 "$RUNNER_TEMP/xingyu-production-d1-meta.json"
      - name: Build and deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_WRITE_LOGS: "false"
        run: npm run deploy:production
      - name: Smoke test homepage, OAuth discovery and protected MCP
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "https://zhangwansen.click/" -o /dev/null
          confirmed=0
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "https://zhangwansen.click/.well-known/oauth-authorization-server" \
              -o "$RUNNER_TEMP/xingyu-oauth-metadata.json" \
              && node scripts/verify-production-deploy.mjs oauth "$RUNNER_TEMP/xingyu-oauth-metadata.json"; then
              confirmed=1
              break
            fi
            sleep 5
          done
          if [[ "$confirmed" != "1" ]]; then
            echo "::error::Production OAuth discovery failed after deploy."
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "https://zhangwansen.click/mcp")"
          if [[ "$status" != "401" ]]; then
            echo "::error::Unauthenticated production MCP must return 401, got $status."
            exit 1
          fi
