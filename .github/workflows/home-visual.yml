name: AXIS marketing home visual acceptance

on:
  pull_request:
    paths:
      - "site/app/page.tsx"
      - "site/features/home/**"
      - "site/features/navigation/**"
      - "site/app/globals.css"
      - "site/scripts/visual-home-acceptance.mjs"
      - ".github/workflows/home-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axis-home-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-browser:
    name: Real React island, desktop + mobile + search
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build the real Worker with isolated local D1
        run: npm run build
      - name: Install CJK fonts for screenshot accuracy
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Assert navigation geometry, real search focus and no overlap
        run: node scripts/visual-home-acceptance.mjs
      - name: Upload all home screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xingyu-real-axis-home
          path: site/visual-home/*.png
          if-no-files-found: warn
          retention-days: 14
