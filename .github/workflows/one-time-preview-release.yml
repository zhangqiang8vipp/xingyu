name: One-time cleanup after verified preview production release

# Housekeeping only; no deployment, secrets or code changes.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-preview-release.yml

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  cleanup:
    name: Prune merged preview branch and remove temporary workflow
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'chore(ops): finalize deployed preview-unification and remove helper (once)'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Verify completed Cloudflare release and clean reviewed refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo="zhangqiang8vipp/xingyu";
          const base="4d8888ffca2d12968913275cbe4713518ca856bc";
          const branchName="fix/unify-space-document-preview-20261027";
          const branchSha="d541b50484acaf4f937e6c169359ef2845d713b0";
          const token=process.env.GITHUB_TOKEN;
          const headSha=process.env.GITHUB_SHA;
          if(process.env.GITHUB_REPOSITORY!==repo||!token||!/^[a-f0-9]{40}$/.test(headSha??""))
            throw new Error("Invalid cleanup context");
          const api=(process.env.GITHUB_API_URL||"https://api.github.com").replace(/\/$/,"")+"/repos/"+repo+"/";
          async function get(path){
            const res=await fetch(api+path,{headers:{Authorization:"Bearer "+token,
              Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},signal:AbortSignal.timeout(20000)});
            if(res.status===404)return null;
            if(!res.ok)throw new Error("GitHub GET "+path+" HTTP "+res.status);
            return res.json();
          }
          async function mutate(method,path,body){
            const res=await fetch(api+path,{method,headers:{Authorization:"Bearer "+token,
              Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(20000)});
            if(!res.ok)throw new Error("GitHub "+method+" "+path+" HTTP "+res.status);
            return res.status===204?true:res.json();
          }
          const head=await get("git/ref/heads/main");
          if(head?.object?.sha!==headSha)throw new Error("main changed; refuse cleanup");
          const release=await get("actions/runs/40475690815");
          if(release?.status!=="completed"||release?.conclusion!=="success"||release?.head_sha!==base)
            throw new Error("Expected Cloudflare release not verified");
          const pr=await get("pulls/70");
          if(pr?.state!=="closed"||!pr?.merged_at||pr?.head?.sha!==branchSha||pr?.head?.ref!==branchName||
             pr?.head?.repo?.full_name!==repo)throw new Error("PR #70 changed");
          const open=await get("pulls?state=open&per_page=100");
          if(!Array.isArray(open)||open.length===100||open.some(x=>x.head?.ref===branchName&&x.head?.repo?.full_name===repo))
            throw new Error("Cannot prove branch is unused");
          const branch=await get("branches/"+encodeURIComponent(branchName));
          if(branch){
            if(branch.name!==branchName||branch.protected||branch.commit?.sha!==branchSha)
              throw new Error("Branch SHA changed or protected, refuse delete");
            await mutate("DELETE","git/refs/heads/"+branchName.split("/").map(encodeURIComponent).join("/"));
            console.log("Removed merged branch "+branchName);
          }else console.log("Branch already removed");
          const remaining=await get("branches?per_page=100");
          if(!Array.isArray(remaining)||remaining.length!==1||remaining[0].name!=="main")
            throw new Error("Branch cleanup did not leave only main");
          const filePath=".github/workflows/one-time-preview-release.yml";
          const f=await get("contents/"+filePath+"?ref=main");
          if(!f||f.type!=="file"||!/^[a-f0-9]{40}$/.test(f.sha??""))
            throw new Error("Cannot verify temporary workflow to remove");
          const unchanged=await get("git/ref/heads/main");
          if(unchanged?.object?.sha!==headSha)throw new Error("main moved before workflow removal");
          await mutate("DELETE","contents/"+filePath,{
            message:"chore(ops): remove completed one-time preview release workflow",
            sha:f.sha,branch:"main"
          });
          console.log("Removed one-time workflow, leaving production code unchanged.");
          console.log("Verified success: only main branch remains.");
          NODE
