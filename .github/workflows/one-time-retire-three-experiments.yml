name: One-time cleanup remaining experiments

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: ${{ github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore(ops): retire three completed experiment branches (once)' }}
    name: Remove 3 stale branches after SHA verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Remove only the three reviewed experimental branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const expected = [
            {name:"fix/openrouter-free-low-reasoning-20261021",sha:"78ab1f199937faf018fe836b26274169952dae05",pr:53},
            {name:"perf/ci-test-concurrency-eight-20261027",sha:"ec14be835b6dd319cd7588865442e9531e2bd996",pr:66},
            {name:"perf/cloudflare-latency-probe-20261026",sha:"635fdbc8353051f5de1914d0a3aa70ca8ae3e00e",pr:null},
          ];
          const repository = "zhangqiang8vipp/xingyu";
          assert.equal(process.env.GITHUB_REPOSITORY,repository);
          assert.equal(process.env.GITHUB_REF,"refs/heads/main");
          const token=process.env.GITHUB_TOKEN;
          if(!token)throw new Error("Missing authenticated token");
          const api="https://api.github.com/repos/"+repository+"/";
          async function request(method,endpoint){
            const res=await fetch(api+endpoint,{
              method,
              headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              signal:AbortSignal.timeout(20000),
            });
            if(res.status===404)return null;
            if(!res.ok)throw new Error(method+" "+endpoint+" failed with HTTP "+res.status);
            if(res.status===204)return true;
            return res.json();
          }
          async function fetchBranch(name){
            return request("GET","branches/"+encodeURIComponent(name));
          }
          const head=await request("GET","git/ref/heads/main");
          if(head?.object?.sha!==process.env.GITHUB_SHA)throw new Error("main has moved during cleanup");
          const active=await request("GET","pulls?state=open&per_page=100");
          if(!Array.isArray(active)||active.length>=100)throw new Error("Incomplete open pull request verification");
          for(const item of expected){
            const b=await fetchBranch(item.name);
            if(!b || b.name!==item.name || b.protected || b.commit?.sha!==item.sha)
              throw new Error("Branch SHA changed or protected: "+item.name);
            if(active.some(p=>p.head?.ref===item.name && p.head?.repo?.full_name===repository))
              throw new Error("Active PR references "+item.name);
            if(item.pr){
              const p=await request("GET","pulls/"+item.pr);
              if(!p || p.state!=="closed" || p.merged_at || p.head?.sha!==item.sha ||
                p.head?.ref!==item.name || p.head?.repo?.full_name!==repository)
                throw new Error("Previous PR changed: #"+item.pr);
            }
          }
          console.log("All 3 branch SHA and PR guards passed; proceeding with deletion");
          for(const item of expected){
            const again=await fetchBranch(item.name);
            if(again?.commit?.sha!==item.sha || again?.protected)
              throw new Error("Branch moved before deletion: "+item.name);
            await request("DELETE","git/refs/heads/"+item.name.split("/").map(encodeURIComponent).join("/"));
            if(await fetchBranch(item.name))throw new Error("Branch still exists: "+item.name);
            console.log("DELETED "+item.name);
          }
          const all=await request("GET","branches?per_page=100");
          if(!Array.isArray(all)||all.length!==1||all[0].name!=="main")
            throw new Error("Cleanup did not leave main as the sole branch");
          console.log("SUCCESS: only main remains");
          NODE
