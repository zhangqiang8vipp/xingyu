name: One-time prune completed coauthor regression branch
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-space-test-prune.yml
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: xingyu-pr71-branch-cleanup
  cancel-in-progress: false
jobs:
  prune:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'chore(ops): prune merged coauthor browser test branch (once)'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Delete exact merged branch after PR and SHA verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo="zhangqiang8vipp/xingyu",branch="test/spaces-browser-regression-20261027";
          const expected="1dd675dd6e3d7a32333befa12d3a100c5afb8c0c",token=process.env.GITHUB_TOKEN;
          if(process.env.GITHUB_REPOSITORY!==repo||process.env.GITHUB_REF!=="refs/heads/main"||!token)
            throw Error("Invalid repository cleanup context");
          const origin=(process.env.GITHUB_API_URL||"https://api.github.com")+"/repos/"+repo+"/";
          async function get(endpoint){
            const r=await fetch(origin+endpoint,{headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"},signal:AbortSignal.timeout(20000)});
            if(r.status===404)return null;
            if(!r.ok)throw Error("GET "+endpoint+": HTTP "+r.status);
            return r.json();
          }
          const head=await get("git/ref/heads/main");
          if(head?.object?.sha!==process.env.GITHUB_SHA)throw Error("main changed since dispatch");
          const pr=await get("pulls/71");
          if(pr?.state!=="closed"||!pr?.merged_at||pr?.head?.ref!==branch||
            pr?.head?.sha!==expected||pr?.head?.repo?.full_name!==repo)
            throw Error("PR #71 must be merged with the exact reviewed head");
          const open=await get("pulls?state=open&per_page=100");
          if(!Array.isArray(open)||open.length===100||
            open.some(p=>p.head?.ref===branch&&p.head?.repo?.full_name===repo))
            throw Error("Cannot prove branch is unused");
          const current=await get("branches/"+encodeURIComponent(branch));
          if(!current||current.name!==branch||current.protected||current.commit?.sha!==expected)
            throw Error("Branch changed, protected or missing; refuse mutation");
          const r=await fetch(origin+"git/refs/heads/"+branch.split("/").map(encodeURIComponent).join("/"),{
            method:"DELETE",headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"},
            signal:AbortSignal.timeout(20000)});
          if(r.status!==204)throw Error("Branch delete refused: HTTP "+r.status);
          const remaining=await get("branches?per_page=100");
          if(!Array.isArray(remaining)||remaining.length!==1||remaining[0].name!=="main")
            throw Error("Unexpected remaining branches after cleanup");
          console.log("SUCCESS: merged PR #71 branch deleted, only main remains");
          NODE
