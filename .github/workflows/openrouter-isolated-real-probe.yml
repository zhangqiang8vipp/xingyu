name: OpenRouter isolated real API parameter probes
on:
  push:
    branches:
      - test/openrouter-live-parameters-20261021
permissions:
  contents: read
jobs:
  real_api_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real authenticated OpenRouter calls (test only; no deployment)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node <<'JS'
          const secret=process.env.OPENROUTER_API_KEY;
          if(!secret){
            console.log("LIVE_PROBE_BLOCKED: GitHub Actions secret OPENROUTER_API_KEY is not configured");
            process.exit(0);
          }
          const prompt=[
            {role:"system",content:"只根据给定资料用简短中文回答，末尾标注 [1]。"},
            {role:"user",content:"问题：这个网站主要分享哪些技术经验？\n公开测试资料：[1] XINGYU 知识库的文章涵盖 Cloudflare Workers、D1 数据库、MCP 接口与 AI 应用集成。"},
          ];
          const cases=[
            {name:"router_default",model:"openrouter/free"},
            {name:"router_low",model:"openrouter/free",reasoning:{effort:"low"}},
            {name:"minimax_free_low",model:"minimax/minimax-m3.1-flash:free",reasoning:{effort:"low"}},
          ];
          for(const c of cases){
            const request={model:c.model,messages:prompt,max_tokens:2048,temperature:0.2,stream:false};
            if(c.reasoning)request.reasoning=c.reasoning;
            const started=Date.now();
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),45000);
            try{
              const response=await fetch("https://openrouter.ai/api/v1/chat/completions",{
                method:"POST",
                headers:{
                  Authorization:"Bearer "+secret,
                  "Content-Type":"application/json",
                  "HTTP-Referer":"https://zhangwansen.click",
                  "X-Title":"XINGYU isolated diagnostic",
                },
                body:JSON.stringify(request),
                signal:controller.signal,
              });
              const raw=await response.text();
              let data=null;try{data=JSON.parse(raw)}catch{}
              const choice=Array.isArray(data?.choices)?data.choices[0]:null;
              const message=choice?.message?.content;
              const content=typeof message==="string" ? message : Array.isArray(message) ?
                message.filter(p=>p?.type==="text" && typeof p?.text==="string").map(p=>p.text).join("") : "";
              const usage=data?.usage||{};
              const extra=usage.completion_tokens_details||{};
              const apiCode=typeof data?.error?.code==="number"?data.error.code:null;
              console.log("REAL_PROBE "+JSON.stringify({
                name:c.name,
                http_status:response.status,
                actual_model:typeof data?.model==="string"?data.model:null,
                finish_reason:typeof choice?.finish_reason==="string"?choice.finish_reason:null,
                completion_tokens:Number.isInteger(usage.completion_tokens)?usage.completion_tokens:null,
                reasoning_tokens:Number.isInteger(extra.reasoning_tokens)?extra.reasoning_tokens:null,
                visible_chars:content.length,
                public_answer_preview:content.slice(0,150),
                upstream_error_code:apiCode,
                latency_ms:Date.now()-started,
              }));
            }catch(err){
              console.log("REAL_PROBE "+JSON.stringify({
                name:c.name,
                transport_error:controller.signal.aborted?"timeout":"network",
                latency_ms:Date.now()-started
              }));
            }finally{clearTimeout(timer);}
          }
          JS
