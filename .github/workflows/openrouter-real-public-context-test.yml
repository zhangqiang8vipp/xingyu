name: XINGYU real public-context OpenRouter comparison
on:
  push:
    branches:
      - test/openrouter-real-public-context-20261022

permissions:
  contents: read

jobs:
  qa_real_context:
    if: github.repository == 'zhangqiang8vipp/xingyu' && github.ref == 'refs/heads/test/openrouter-real-public-context-20261022'
    runs-on: ubuntu-latest
    environment:
      name: CLOUDFLARE
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Compare default vs low reasoning with real public XINGYU sources
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node site/scripts/openrouter-real-public-context-probe.mjs
