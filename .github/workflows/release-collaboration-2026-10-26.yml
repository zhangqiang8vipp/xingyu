name: One-time collaboration production release (schema 26)

# This workflow never triggers on push; it requires two typed confirmations and
# the protected CLOUDFLARE Environment. The existing manual deployment stays intact.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE-COLLAB-26 to approve the production Worker release"
        required: true
        type: string
      migrate:
        description: "Type D1-SCHEMA-26 to authorize the additive D1 migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xingyu-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Full CI and exact branch/confirmation checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - name: Require explicit confirmations and main
        working-directory: .
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          D1_CONFIRM: ${{ inputs.migrate }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$RELEASE_CONFIRM" != "RELEASE-COLLAB-26" || "$D1_CONFIRM" != "D1-SCHEMA-26" ]]; then
            echo "::error::Select main and type both exact release confirmation phrases."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Check release scripts syntax
        run: |
          bash -n scripts/collaboration-production-apply.sh
          node --check scripts/collaboration-production-release.mjs
          node scripts/verify-production-deploy.mjs config
      - name: Run complete CI before production access
        run: npm run ci

  release:
    name: Protected D1 migration and Worker deployment
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: CLOUDFLARE
      url: https://zhangwansen.click
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Validate D1, capture Time Travel point, migrate, deploy and smoke
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_WRITE_LOGS: "false"
        run: bash scripts/collaboration-production-apply.sh
