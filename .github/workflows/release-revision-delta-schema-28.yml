name: One-time revision-delta schema28 production release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE-REVISION-28"
        type: string
        required: true
      migrate:
        description: "Type D1-REVISION-28 (additive only)"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: xingyu-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
      - name: Check main branch, user confirmation and exact full CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          MIGRATION_CONFIRM: ${{ inputs.migrate }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_CONFIRM" = "RELEASE-REVISION-28"
          test "$MIGRATION_CONFIRM" = "D1-REVISION-28"
          node scripts/verify-production-ci.mjs
          node scripts/verify-production-deploy.mjs config
  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: CLOUDFLARE
      url: https://zhangwansen.click
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install exact dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check exact D1 identity and migration state, backup, migrate, deploy and smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          WRANGLER_WRITE_LOGS: "false"
        run: |
          set -euo pipefail
          test "$PRODUCTION_DEPLOY_ENABLED" = "true"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          ROOT="$RUNNER_TEMP/xingyu-revision28"
          mkdir -p "$ROOT"
          node scripts/verify-production-deploy.mjs config
          read_d1() {
            npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "SELECT key,value FROM app_meta WHERE key IN ('schema_version','app_environment','instance_id')" --json > "$ROOT/meta.json"
            npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "SELECT name FROM d1_migrations ORDER BY name" --json > "$ROOT/migrations.json"
            npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "PRAGMA table_info(document_revisions)" --json > "$ROOT/cols.json"
          }
          read_d1
          node --input-type=module - "$ROOT" preflight <<'NODE'
          import {readFileSync,readdirSync,writeFileSync} from "node:fs";
          import path from "node:path";
          const [root,mode]=process.argv.slice(2);
          const rows=name=>{
            const data=JSON.parse(readFileSync(path.join(root,name),"utf8"));
            const stack=Array.isArray(data)?data:[data],items=[];
            while(stack.length){
              const row=stack.shift();
              if(!row||row.success===false)throw Error("D1 read failed");
              if(Array.isArray(row.results))items.push(...row.results);
              if(Array.isArray(row.result))stack.push(...row.result);
            }
            return items;
          };
          const markers=new Map(rows("meta.json").map(x=>[x.key,x.value]));
          if(markers.size!==3||markers.get("app_environment")!=="production"||
             markers.get("instance_id")!=="production:xingyu-blog")throw Error("Wrong production D1 identity");
          const version=markers.get("schema_version");
          if(!["27","28"].includes(version))throw Error("Unexpected production schema "+version);
          const names=readdirSync("drizzle").filter(x=>/^\d{4}_.+\.sql$/.test(x)).sort();
          if(names.length!==27||names[26]!=="0026_revision_delta_storage.sql")throw Error("Local migration inventory mismatch");
          const applied=rows("migrations.json").map(x=>x.name).sort();
          const migrated=applied.length===27&&applied.every((name,i)=>name===names[i]);
          const previous=applied.length===26&&applied.every((name,i)=>name===names[i]);
          if(!migrated&&!previous)throw Error("Remote migration history mismatch");
          const cols=new Set(rows("cols.json").map(x=>x.name));
          const newCols=["reverse_patch","original_content_length","compaction_state"];
          const present=newCols.filter(x=>cols.has(x)).length;
          if((migrated&&present!==3)||(!migrated&&present!==0)|| (version==="28"&&!migrated))
            throw Error("D1 migration and columns disagree");
          if(mode==="postmarker"&&version!=="28")throw Error("D1 schema marker not 28");
          if(mode!=="preflight"&&!migrated)throw Error("0026 missing");
          writeFileSync(path.join(root,"plan"),(migrated?"no":"yes")+"\n"+(version==="27"?"yes":"no")+"\n");
          console.log("Verified production D1 schema",version,"migration 0026 applied:",migrated);
          NODE
          migrate="$(sed -n '1p' "$ROOT/plan")"
          marker="$(sed -n '2p' "$ROOT/plan")"

          # Build before mutating D1, minimizing the old/new Worker mismatch.
          npm run build
          test -s dist/server/index.js
          if [[ "$migrate" == "yes" || "$marker" == "yes" ]]; then
            # Timestamp is a usable Cloudflare D1 Time Travel recovery reference.
            # It is safe to log (not the database contents) and remains available
            # after the ephemeral runner deletes its private JSON bookmark file.
            echo "::notice::PRE-MIGRATION D1 RECOVERY UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            npx wrangler d1 time-travel info DB --config wrangler.production.jsonc --json > "$ROOT/bookmark.json"
            node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));let found=false;const walk=o=>{if(!o||typeof o!=="object")return;for(const [k,v] of Object.entries(o)){if(/bookmark/i.test(k)&&typeof v==="string"&&v.length>12)found=true;else if(v&&typeof v==="object")walk(v)}};walk(value);if(!found)throw Error("D1 Time Travel bookmark unavailable; stop without writing");console.log("Protected D1 Time Travel recovery bookmark confirmed")' "$ROOT/bookmark.json"
          fi
          if [[ "$migrate" == "yes" ]]; then
            npx wrangler d1 migrations apply DB --config wrangler.production.jsonc --remote
          fi
          read_d1
          node --input-type=module - "$ROOT" postapply <<'NODE'
          import {readFileSync} from "node:fs";
          import path from "node:path";
          const [root]=process.argv.slice(2);
          const rows=name=>{const data=JSON.parse(readFileSync(path.join(root,name),"utf8"));const arr=Array.isArray(data)?data:[data];if(arr.some(x=>x.success===false))throw Error("D1 read failed");return arr.flatMap(x=>x.results??x.result?.flatMap(y=>y.results??[])??[])};
          const cols=new Set(rows("cols.json").map(x=>x.name));
          if(!["reverse_patch","original_content_length","compaction_state"].every(n=>cols.has(n)))throw Error("Revision patch columns missing");
          if(!rows("migrations.json").some(x=>x.name==="0026_revision_delta_storage.sql"))throw Error("Migration not recorded");
          NODE
          if [[ "$marker" == "yes" ]]; then
            npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "UPDATE app_meta SET value='28' WHERE key='schema_version' AND value='27' AND EXISTS(SELECT 1 FROM d1_migrations WHERE name='0026_revision_delta_storage.sql') AND (SELECT COUNT(*) FROM pragma_table_info('document_revisions') WHERE name IN ('reverse_patch','original_content_length','compaction_state'))=3" --json > "$ROOT/marker.json"
          fi
          read_d1
          node scripts/verify-production-deploy.mjs d1 "$ROOT/meta.json"
          # The compaction opt-in stays ABSENT. Migration NEVER rewrites old bodies.
          npx wrangler deploy --config wrangler.production.jsonc
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 'https://zhangwansen.click/' -o /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 'https://zhangwansen.click/ask' -o /dev/null
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://zhangwansen.click/mcp')"
          test "$status" = "401"
          echo "::notice::schema28 deployed; historical snapshots remain untouched."
