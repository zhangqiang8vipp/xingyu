name: Protected history compaction opt-in (schema28)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit=read-only, enable=start, disable=stop future compaction"
        required: true
        type: choice
        options:
          - audit
          - enable
          - disable
      confirm:
        description: "For enable type ENABLE-REVISION-DELTAS; disable: DISABLE-REVISION-DELTAS"
        required: false
        type: string
      backup_ack:
        description: "For enable type TIME-TRAVEL-IS-TEMPORARY"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: xingyu-production-deploy
  cancel-in-progress: false

jobs:
  audit-and-enable:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: CLOUDFLARE
      url: https://zhangwansen.click
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify D1 identity and audit history without private contents in logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          BACKUP_ACK: ${{ inputs.backup_ack }}
          WRANGLER_WRITE_LOGS: "false"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PRODUCTION_DEPLOY_ENABLED" = "true"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-production-deploy.mjs config
          ROOT="$RUNNER_TEMP/revision-delta"
          mkdir -p "$ROOT"
          npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "SELECT key,value FROM app_meta WHERE key IN ('schema_version','app_environment','instance_id')" --json > "$ROOT/meta.json"
          node scripts/verify-production-deploy.mjs d1 "$ROOT/meta.json"
          curl --fail --silent --show-error --location 'https://zhangwansen.click/' -o /dev/null
          npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "SELECT COUNT(*) AS total,COALESCE(SUM(length(content)),0) AS full_chars,COALESCE(SUM(length(reverse_patch)),0) AS delta_chars,SUM(CASE WHEN reverse_patch IS NOT NULL THEN 1 ELSE 0 END) AS delta_rows,SUM(CASE WHEN compaction_state='pending' THEN 1 ELSE 0 END) AS pending_rows FROM document_revisions" --json > "$ROOT/stats.json"
          node --input-type=module - "$ROOT/stats.json" <<'NODE'
          import {readFileSync} from "node:fs";
          const input=JSON.parse(readFileSync(process.argv[2],"utf8"));
          const array=Array.isArray(input)?input:[input];
          if(array.some(x=>x.success===false))throw Error("D1 history audit failed");
          const result=array.flatMap(x=>x.results??[])[0];
          if(!result||!Number.isFinite(Number(result.total)))throw Error("Invalid D1 history audit");
          console.log("History audit (no private content):",JSON.stringify(result));
          NODE

          if [[ "$MODE" == "audit" ]]; then
            echo "::notice::Read-only history audit complete; no database write was made."
            exit 0
          fi
          if [[ "$MODE" == "disable" ]]; then
            test "$CONFIRM" = "DISABLE-REVISION-DELTAS"
            npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "INSERT INTO app_meta(key,value) VALUES ('revision_delta_compaction_enabled','0') ON CONFLICT(key) DO UPDATE SET value='0'" --json > "$ROOT/disabled.json"
            npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "SELECT key,value FROM app_meta WHERE key='revision_delta_compaction_enabled'" --json > "$ROOT/verify.json"
            node -e 'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const entries=Array.isArray(a)?a:[a];if(entries.some(x=>x.success===false))throw Error("Remote D1 disable failed");const rows=entries.flatMap(x=>x.results??[]);if(rows.length!==1||rows[0].value!=="0")throw Error("Compaction flag did not disable");console.log("Future revision compaction disabled; past deltas remain reversible")' "$ROOT/verify.json"
            echo "::notice::Daily history compaction was disabled; historical revisions were not deleted."
            exit 0
          fi
          test "$MODE" = "enable"
          test "$CONFIRM" = "ENABLE-REVISION-DELTAS"
          test "$BACKUP_ACK" = "TIME-TRAVEL-IS-TEMPORARY"
          echo "::notice::PRE-COMPACTION D1 RECOVERY UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          npx wrangler d1 time-travel info DB --config wrangler.production.jsonc --json > "$ROOT/bookmark.json"
          node -e 'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));let found=false;const walk=x=>{if(!x||typeof x!=="object")return;for(const [k,y] of Object.entries(x)){if(/bookmark/i.test(k)&&typeof y==="string"&&y.length>12)found=true;else if(y&&typeof y==="object")walk(y)}};walk(v);if(!found)throw Error("D1 Time Travel bookmark unavailable");console.log("D1 recovery point verified; bookmarks expire, do not auto-restore")' "$ROOT/bookmark.json"
          npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "INSERT INTO app_meta(key,value) SELECT 'revision_delta_compaction_enabled','1' WHERE (SELECT value FROM app_meta WHERE key='schema_version')='28' AND (SELECT value FROM app_meta WHERE key='app_environment')='production' AND (SELECT value FROM app_meta WHERE key='instance_id')='production:xingyu-blog' ON CONFLICT(key) DO UPDATE SET value='1' WHERE (SELECT value FROM app_meta WHERE key='schema_version')='28'" --json > "$ROOT/enabled.json"
          npx wrangler d1 execute DB --config wrangler.production.jsonc --remote --command "SELECT key,value FROM app_meta WHERE key='revision_delta_compaction_enabled'" --json > "$ROOT/verify.json"
          node -e 'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const rows=Array.isArray(a)?a.flatMap(x=>x.results??[]):a.results??[];if(rows.length!==1||rows[0].value!=="1")throw Error("Compaction flag not enabled");console.log("Bounded daily delta compaction has been opted in")' "$ROOT/verify.json"
          echo "::notice::History compaction enabled. At most 25 old versions will be verified per daily cron; no revision rows are deleted."
